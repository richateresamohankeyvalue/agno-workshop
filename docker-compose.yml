services:
  db:
    image: agnohq/pgvector:18
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
    ports:
      - "5532:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  mcp:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./mcp_server:/app/mcp_server
    command: >
      bash -c "pip install --quiet --no-cache-dir 'mcp[cli]<2' &&
      python mcp_server/server.py"
    ports:
      - "8081:8081"

volumes:
  pgdata:
